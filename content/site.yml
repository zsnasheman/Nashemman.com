  profileHeading: "A line that starts in Kashmir"
  # Markdown is allowed in the profile.
  profile: |
    Nashemman Sahiba Zargar is a designer and the founder of **The Scribble Lab**, a design and build studio in Dubai. Her story begins in Kashmir. It runs through Delhi Public School and a bachelor's degree at Amity University Dubai, then through roughly five years inside other practices, among them XBD, Swiss Bureau and DLR Group, before she opened a studio of her own in 2022.

    The studio works on homes and workplaces, brand activations, kinetic window displays, exhibitions and events. A second business, devoted to interior accessories, is now taking shape.

    This is not a record of finished things. It is a place to follow the line while it is still being drawn.
