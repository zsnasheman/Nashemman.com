name: "Nashemman Sahiba Zargar"
firstName: "Nashemman"
lastNames: "Sahiba Zargar"
monogram: "NSZ"
description: "Nashemman Sahiba Zargar: designer from Kashmir, founder of The Scribble Lab in Dubai, and a builder of more than one venture."

home:
  # Intro panel on the first screen.
  kicker: "Designer · Founder"
  intro: "A designer from Kashmir who studied, practised and set up her studio in Dubai. In 2022 she founded The Scribble Lab, a design and build studio. Now she is developing a second business, in interior accessories."
  # Big statement. Words wrapped in [[double brackets]] get a colour patch.
  statement: "She designs spaces [[and builds them]]. One studio, [[one more venture]] on the way."
  facts:
    - { label: "Roots", value: "Kashmir" }
    - { label: "Studied", value: "Delhi Public School · Amity University Dubai" }
    - { label: "Practice", value: "About five years, incl. XBD, Swiss Bureau, DLR Group" }
    - { label: "Founded", value: "The Scribble Lab, 2022" }
    - { label: "In development", value: "An interior accessories business" }

studio:
  name: "The Scribble Lab"
  since: "2022"
  url: "https://thescribblelab.com/"
  lead: "Nashemman founded The Scribble Lab in 2022 as a creative design and build studio."
  body: "Design and construction sit under one roof, so the idea and its making stay in the same hands. As founder she leads work that ranges from homes and workplaces to brand activations, kinetic window displays, exhibitions and events: spaces that last for years, and spaces built for a single week."

venture:
  label: "In development"
  title: "A second business, in interior accessories."
  body: "Its name, products and launch will be shared when Nashemman is ready. The direction is clear: from the scale of rooms to the objects that live in them."

# The six disciplines on the material board.
# `media` points to an optional photo slot in media.yml. While a slot is
# empty, the tile shows an illustrated material study, labelled as such.
board:
  - id: residential
    title: "Residential interiors"
    media: "board-residential"
    blurb: "Homes, designed and then built by the same studio: from the first drawing to the finished room."
  - id: commercial
    title: "Commercial interiors"
    media: "board-commercial"
    blurb: "Workplaces and commercial spaces that have to perform every day, for the people inside them and the brands they carry."
  - id: brand
    title: "Brand activations"
    media: "board-brand"
    blurb: "Short-lived spaces with one job: to make a brand felt in person. Quick to install, built to be remembered."
  - id: kinetic
    title: "Kinetic window displays"
    media: "board-kinetic"
    blurb: "Shop windows that move. Mechanism, rhythm and light turn a fixed frame into something people stop for."
  - id: exhibitions
    title: "Exhibitions"
    media: "board-exhibitions"
    blurb: "Stands and exhibition spaces planned around how visitors arrive, pause and meet."
  - id: events
    title: "Events"
    media: "board-events"
    blurb: "Stages, sets and spaces for a night or a weekend, designed and delivered by one team."

