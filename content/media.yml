# ─────────────────────────────────────────────────────────────
#  Media slots. Every photo or video on the site points to a slot.
#
#  To add a file:
#    1. Put it in /public/media/  (e.g. public/media/portrait.jpg)
#    2. Set  src: "/media/portrait.jpg"
#    3. Write a real description in  alt, and fill in  credit
#  Only use files Nashemman or the studio has the rights to publish.
#
#  While src is empty, visitors see an intentional illustrated
#  composition instead. `label` and `brief` are INTERNAL notes: they are
#  never shown on the live site (see ASSETS.md for the checklist).
# ─────────────────────────────────────────────────────────────

