# ─────────────────────────────────────────────────────────────
#  Media slots. Every image or video on the site points to a slot here.
#
#  To replace a placeholder:
#    1. Put the file in /public/media/  (e.g. public/media/portrait.jpg)
#    2. Set  src: "/media/portrait.jpg"
#    3. Write a real description in  alt
#    4. Fill in  credit  (photographer / owner). Only use files you have rights to.
#  For video use  type: video  and optionally  poster: "/media/poster.jpg".
#  Leave src empty ("") to keep the labelled placeholder.
# ─────────────────────────────────────────────────────────────

